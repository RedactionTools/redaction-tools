name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: redaction
          POSTGRES_USER: redaction
          POSTGRES_PASSWORD: redaction
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://redaction:redaction@localhost:5432/redaction
      SECRET_KEY: github-actions-insecure-key-for-tests-only
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups
      - name: Check for missing migrations
        run: uv run manage.py makemigrations --check --dry-run
      - name: Check the committed OpenAPI schema is current
        run: |
          uv run manage.py export_openapi_schema --api config.api.api --output openapi.json --indent 2
          git diff --exit-code openapi.json
      - run: uv run pytest --cov --cov-report=term-missing

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Check the generated API client is current
        run: |
          bun run api:generate
          git diff --exit-code src/lib/api/generated
      - run: bun run lint
      - run: bun run format:check
      # `next typegen` writes .next/types, which tsconfig.json includes for the
      # LayoutProps/PageProps globals; tsc cannot resolve them without it.
      - run: bun run typecheck

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          # Per-context scope, or the two matrix legs overwrite each other.
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
